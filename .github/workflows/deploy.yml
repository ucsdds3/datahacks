name: Deploy Datahacks to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # GitHub Pages serves static files and does not fall back to index.html
      # for client-side routes. Give the private alternate themes their own
      # entry documents so direct links and browser refreshes work.
      - name: Create direct-route entries
        run: |
          mkdir -p dist/themes dist/pop dist/press
          cp dist/index.html dist/themes/index.html
          cp dist/index.html dist/pop/index.html
          cp dist/index.html dist/press/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
