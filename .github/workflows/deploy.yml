name: Deploy Datahacks to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # DataHacks 2026 is over, so we publish the static holding page in
      # ./placeholder instead of building the full Vite site. The 2026 site is
      # untouched on main -- revert this commit to bring it back (restore the
      # Setup Node / npm install / npm run build steps and upload ./dist).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./placeholder

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
