name: Deploy Datahacks to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # GitHub Pages serves static files and does not fall back to index.html
      # for client-side routes. 404.html is the catch-all Pages does honour, and
      # it is the only thing that covers nested routes like /datacraft/about --
      # enumerating directories cannot, because the chapter list changes.
      # The top-level entries stay so those URLs answer 200 rather than 404.
      - name: Create direct-route entries
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/datacraft dist/themes dist/pop dist/press dist/groove dist/legacy
          for route in datacraft themes pop press groove legacy; do
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
